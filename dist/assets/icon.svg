<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f0c1b"/>
      <stop offset="100%" stop-color="#05030a"/>
    </linearGradient>
    
    <!-- Neon Glow Gradient -->
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>

    <!-- Soundwave Gradient -->
    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#67e8f9"/>
      <stop offset="50%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#f43f5e"/>
    </linearGradient>

    <!-- Bezel Shadow Filter -->
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#8b5cf6" flood-opacity="0.3"/>
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.5"/>
    </filter>

    <!-- Inner Bevel/Glow Effect -->
    <filter id="innerGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in2="SourceAlpha" operator="arithmetic" k2="-1" k3="1" result="shadowDiff"/>
      <feFlood flood-color="#ffffff" flood-opacity="0.4"/>
      <feComposite in2="shadowDiff" operator="in"/>
      <feComposite in2="SourceGraphic" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>

  <!-- Glowing outer rings -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="url(#glowGrad)" stroke-width="4" opacity="0.2"/>
  <circle cx="256" cy="256" r="160" fill="none" stroke="url(#glowGrad)" stroke-width="2" opacity="0.4" stroke-dasharray="10 15"/>

  <!-- Fidget Button Bezel -->
  <circle cx="256" cy="256" r="130" fill="#1e1b38" stroke="#3730a3" stroke-width="6" filter="url(#dropShadow)"/>

  <!-- Inner Tactile Button Cap -->
  <circle cx="256" cy="256" r="110" fill="url(#bgGrad)" stroke="url(#glowGrad)" stroke-width="4" filter="url(#innerGlow)"/>

  <!-- Soundwave/Fidget core design -->
  <g transform="translate(136, 206)">
    <!-- Simulated Soundwaves -->
    <rect x="20" y="30" width="16" height="40" rx="8" fill="url(#waveGrad)" opacity="0.7"/>
    <rect x="48" y="20" width="16" height="60" rx="8" fill="url(#waveGrad)" opacity="0.8"/>
    <rect x="76" y="10" width="16" height="80" rx="8" fill="url(#waveGrad)"/>
    <rect x="104" y="25" width="16" height="50" rx="8" fill="url(#waveGrad)"/>
    <rect x="132" y="5" width="16" height="90" rx="8" fill="url(#waveGrad)"/>
    <rect x="160" y="35" width="16" height="30" rx="8" fill="url(#waveGrad)" opacity="0.9"/>
    <rect x="188" y="15" width="16" height="70" rx="8" fill="url(#waveGrad)" opacity="0.8"/>
    <rect x="216" y="30" width="16" height="40" rx="8" fill="url(#waveGrad)" opacity="0.7"/>
  </g>
</svg>
